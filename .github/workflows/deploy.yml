# Vérifie et publie le site sur GitHub Pages à chaque push sur main.
# Sur les pull requests, vérifie seulement (tests, lint, types, build).
# Les modèles 3D et l'index viennent du workflow « Données », par le cache.
name: Déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # republie le site quand le workflow « Données » a reconstruit les modèles sur main
  workflow_run:
    workflows: [Données]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /klods
      NEXT_PUBLIC_SITE_URL: https://ncabotsav.github.io/klods
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # les modèles et l'index construits par le workflow « Données » (absent tant qu'il n'a pas tourné)
      - name: Données du site
        uses: actions/cache/restore@v6
        with:
          path: public/data
          key: site-data-latest
          restore-keys: site-data-
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # parcours de montage de bout en bout, sur le site construit (s'il y a des données)
      - name: Tests de bout en bout
        if: hashFiles('public/data/sets.json') != ''
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Traces des tests en échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-e2e
          path: test-results
          retention-days: 7
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
