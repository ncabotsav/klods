# Vérifie et publie le site sur GitHub Pages à chaque push sur main.
# Sur les pull requests, vérifie seulement (tests, lint, types, build).
# Les modèles 3D et l'index viennent du workflow « Données », par le cache.
name: Déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # republie le site quand le workflow « Données » a reconstruit les modèles sur main
  workflow_run:
    workflows: [Données]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /klods
      NEXT_PUBLIC_SITE_URL: https://ncabotsav.github.io/klods
      NEXT_TELEMETRY_DISABLED: 1
      # pour lire le nombre d'étoiles du dépôt au build sans buter sur la limite anonyme de l'API
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # les modèles et l'index construits par le workflow « Données » (absent tant qu'il n'a pas tourné)
      - name: Données du site
        uses: actions/cache/restore@v6
        with:
          path: public/data
          key: site-data-latest
          restore-keys: site-data-
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # parcours de montage de bout en bout, sur le site construit (s'il y a des données)
      - name: Tests de bout en bout
        if: hashFiles('public/data/sets.json') != ''
        env:
          # Chrome (ordinateur et téléphone), Safari (iPhone) et Firefox
          E2E_ALL_BROWSERS: 1
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run e2e
      # mesure Lighthouse (téléphone simulé) sur le site construit, compressé comme sur GitHub Pages ;
      # les notes vont dans le résumé du workflow, sans le faire échouer
      - name: Lighthouse
        if: hashFiles('public/data/sets.json') != ''
        continue-on-error: true
        run: |
          node scripts/serve-out.mjs 4173 &
          sleep 1
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          set_number="$(node -e 'const s=require("./public/data/sets.json").sets; console.log((s.find(x=>x.number==="889-1")||s[0]).number)')"
          echo "## Lighthouse (téléphone simulé)" >> "$GITHUB_STEP_SUMMARY"
          for page in "" "set/$set_number/" "catalogue/"; do
            npx -y lighthouse@13.5.0 "http://localhost:4173/klods/$page" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,seo,best-practices --output=json --output-path=lh.json
            node -e 'const r=require("./lh.json");const c=r.categories;console.log(`- /${process.argv[1]} : performance ${Math.round(c.performance.score*100)}, accessibilité ${Math.round(c.accessibility.score*100)}, bonnes pratiques ${Math.round(c["best-practices"].score*100)}, référencement ${Math.round(c.seo.score*100)} (LCP ${r.audits["largest-contentful-paint"].displayValue})`)' "$page" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Traces des tests en échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-e2e
          path: test-results
          retention-days: 7
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
