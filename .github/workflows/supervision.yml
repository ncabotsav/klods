# Supervision de klods.app : toutes les 30 minutes, vérifie les pages clés, un modèle et la route des retours.
# Un échec fait échouer le workflow, et GitHub prévient par e-mail (notifications des Actions).
name: Supervision

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://klods.app
    steps:
      - name: Pages, modèle et route des retours
        run: |
          fail=0
          check() { # check <chemin> <code attendu> [texte attendu] [méthode]
            out="$(curl -sS -m 20 -X "${4:-GET}" -o body -w '%{http_code} %{time_total}' "$SITE$1" || echo "000 0")"
            code="${out% *}"; time="${out#* }"
            if [ "$code" != "$2" ]; then echo "::error::$1 : $code (attendu $2)"; fail=1; return; fi
            if [ -n "$3" ] && ! grep -q "$3" body; then echo "::error::$1 : « $3 » absent de la page"; fail=1; return; fi
            echo "OK $1 ($code, ${time}s)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          check / 200 "Klods"
          check /catalogue/ 200 "Catalogue"
          check /sitemap.xml 200 "<urlset"
          check /robots.txt 200 "Sitemap"
          # pages légales et formulaire de retours (critère du sprint 7)
          check /mentions-legales/ 200 "CABOT-SAVIN"
          check /confidentialite/ 200 "Web Analytics"
          check /conditions/ 200 "Conditions"
          check /credits/ 200 "LDraw"
          check /retours/ 200 "Envoyer un retour"
          # une fiche et son modèle, pris dans l'index du site
          curl -sS -m 20 "$SITE/data/sets.json" -o sets.json || { echo "::error::/data/sets.json injoignable"; exit 1; }
          read -r set file < <(node -e 'const s=require("./sets.json").sets.find(x=>x.models.some(m=>m.status==="ok"));const m=s.models.find(m=>m.status==="ok");console.log(s.number,m.file)')
          check "/set/$set/" 200 "$set"
          check "/$file" 200
          check /une-page-qui-n-existe-pas/ 404
          # le Worker répond (un GET sur la route des retours est refusé, sans rien enregistrer)
          check /api/retours 405 "method"
          exit $fail
